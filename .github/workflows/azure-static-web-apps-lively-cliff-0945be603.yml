# Deploy to Azure Static Web Apps
#
# Design criteria (apply to every change to this workflow):
# 1. Smallest possible deploy package (aggressive trimming, minimal assemblies)
# 2. Fastest possible pipeline (no redundant steps, cache everything cacheable)
# 3. Minimum number of steps (consolidate where safe, eliminate no-ops)
# 4. Fast-fail on errors (tests before deploy, set -e in shell blocks)
# 5. Harden supply chain — Directory.Packages.props pins all package
#    versions; deployment token auth; no npm in CI
# 6. No duplicate steps — single checkout, single restore, single build
# 7. Single job for build+deploy — avoids duplicate overhead
# 8. Health check after deploy — confirms production is live (push only)
# 9. Pipeline-neutral skips — skip deploy for docs/config-only changes
#
# This workflow will build and push a web application to an Azure Static Web App when you change your code.
#
# This workflow assumes you have already created the target Azure Static Web App.
# For instructions see https://docs.microsoft.com/azure/static-web-apps/get-started-portal?tabs=vanilla-javascript
#
# To configure this workflow:
#
# 1. Set up a secret in your repository named AZURE_STATIC_WEB_APPS_API_TOKEN with the value of your Static Web Apps deployment token.
#    For instructions on obtaining the deployment token see: https://docs.microsoft.com/azure/static-web-apps/deployment-token-management
#
# 3. Change the values for the APP_LOCATION, API_LOCATION and APP_ARTIFACT_LOCATION, AZURE_STATIC_WEB_APPS_API_TOKEN environment variables (below).
#    For instructions on setting up the appropriate configuration values go to https://docs.microsoft.com/azure/static-web-apps/front-end-frameworks
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: ["master"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["master"]

# Environment variables available to all jobs and steps in this workflow
env:
  APP_LOCATION: "src/redmuffin.Blazor.StaticWeb" # location of your client code
  API_LOCATION: "src/redmuffin.Blazor.StaticWeb.Api" # location of your api source code - optional
  APP_ARTIFACT_LOCATION: "wwwroot" # location of client code build output
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }} # secret containing deployment token for your static web app

permissions:
  contents: read

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_output.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for reliable change detection
          show-progress: false # Reduce log noise

      - name: Check if only pipeline-neutral files changed
        id: check
        uses: tj-actions/changed-files@v47.0.6
        with:
          # Use the push's base SHA (remote HEAD before push) to check ALL
          # commits in the batch, not just the tip. github.event.before is
          # the SHA before the push; for PR events, use the PR base.
          base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          files_from_source_file: .github/pipeline-neutral-patterns.txt

      - name: Set skip output
        id: skip_output
        run: |
          if [[ "${{ steps.check.outputs.only_changed }}" == "true" ]]; then
            echo "result=skip reason=pipeline-neutral"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "result=run reason=code-changed"
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  test_and_build_job:
    needs: check_changes
    if: |
      needs.check_changes.outputs.should_skip != 'true' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test, Build and Deploy
    env:
      # Environment variables for Azure Functions testing
      # These are automatically picked up by:
      # - TestBase class via AddEnvironmentVariables() for tests
      # - Settings class via Environment.GetEnvironmentVariable() for Azure Functions
      # No local.settings.json file needed in CI/CD - optimized for faster execution
      Values__RainDropClientId: ${{ secrets.RAINDROP_CLIENT_ID }}
      Values__RainDropClientSecret: ${{ secrets.RAINDROP_CLIENT_SECRET }}
      Values__RainDropTestToken: ${{ secrets.RAINDROP_TEST_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1 # Shallow clone for faster checkout
          show-progress: false # Reduce log noise

      - name: Job context
        run: |
          echo "::group::Context"
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "commit=${{ github.sha }}"
          echo "runner=${{ runner.os }}"
          echo "cpu=$(nproc)"
          echo "mem=$(free -h | grep Mem | awk '{print $2}' | sed 's/i//g')"
          echo "disk=$(df -h / | tail -1 | awk '{print $4}')"
          echo "sdk=$(dotnet --version)"
          echo "::endgroup::"

      # Runner image (ubuntu-24.04) provides .NET SDK 10.0.201 pre-installed.
      # global.json (10.0.100 + latestMinor) accepts it — no setup-dotnet download.
      # Only install the one workload we actually need, if it's not already present.
      - name: Install WASM workload for Blazor publish
        run: |
          if dotnet workload list | grep -q wasm-tools-net9; then
            echo "wasm=cached"
          else
            echo "wasm=installing"
            dotnet workload install wasm-tools-net9
          fi

      # OPTIMIZATION: Cache NuGet packages for faster subsequent builds
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # OPTIMIZATION: Single dependency restoration (includes trimming packages for Blazor publish)
      - name: Restore dependencies
        run: dotnet restore -p:PublishTrimmed=true

      # TESTING PHASE: Fast fail if tests don't pass with parallel execution
      # TUnit runs via dotnet run (native, no VSTest dependency)
      # Note: Tests automatically use environment variables set in the job environment
      # No local.settings.json file needed as TestBase class uses AddEnvironmentVariables()
      # Build once, run both test projects in parallel (--no-build avoids duplicate compilation)
      - name: Build solution
        run: dotnet build -c Release

      - name: Run tests
        run: |
          echo "::group::Tests"
          dotnet run --project tests/redmuffin.Blazor.StaticWeb.Tests -c Release --no-build &
          PID1=$!
          dotnet run --project tests/redmuffin.Blazor.StaticWeb.Api.Tests -c Release --no-build &
          PID2=$!
          wait $PID1 || { echo "FAIL: blazor_tests exit_code=$?"; kill $PID2 2>/dev/null; exit 1; }
          wait $PID2 || { echo "FAIL: api_tests exit_code=$?"; exit 1; }
          echo "result=pass"
          echo "::endgroup::"

      # DEPLOY PHASE — push events only. PR events stop after tests.
      - name: Publish and verify trimming
        if: github.event_name == 'push'
        run: |
          set -e
          echo "::group::Publish"

          # Blazor publish CANNOT use --no-build (known bug in .NET 9 SDK:
          # dotnet/aspnetcore issue 58321 — content files get named wrong).
          # API publish CAN use --no-build — already compiled above.
          dotnet publish ${{ env.APP_LOCATION }} \
            -c Release \
            -o ${{ env.APP_LOCATION }}/bin/Release/publish \
            -p:PublishTrimmed=true \
            --no-restore \
            --nologo &
          PID_B=$!

          dotnet publish ${{ env.API_LOCATION }} \
            -c Release \
            -o ${{ env.API_LOCATION }}/bin/Release/publish \
            --no-restore \
            --no-build \
            --no-dependencies \
            --nologo &
          PID_A=$!

          wait $PID_B || { echo "FAIL: blazor_publish exit_code=$?"; kill $PID_A 2>/dev/null; exit 1; }
          echo "blazor_publish=ok"

          ASSEMBLY_COUNT=$(jq '.resources.fingerprinting | keys | map(select(endswith(".wasm"))) | length' "${{ env.APP_LOCATION }}/bin/Release/publish/wwwroot/_framework/blazor.boot.json")
          echo "wasm_assemblies=$ASSEMBLY_COUNT"
          if [ "$ASSEMBLY_COUNT" -gt 60 ]; then
            echo "FAIL: trimming check count=$ASSEMBLY_COUNT max=60"
            exit 1
          fi

          wait $PID_A || { echo "FAIL: api_publish exit_code=$?"; exit 1; }
          echo "api_publish=ok"
          echo "::endgroup::"

      - name: Deploy to Azure Static Web Apps
        id: deploy
        if: github.event_name == 'push'
        uses: shibayan/swa-deploy@v1
        with:
          app-location: ${{ env.APP_LOCATION }}/bin/Release/publish/wwwroot
          api-location: ${{ env.API_LOCATION }}/bin/Release/publish
          api-language: dotnetisolated
          environment-name: production
          deployment-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }}

      - name: Pipeline summary
        if: github.event_name == 'push'
        run: |
          echo "::group::Summary"
          echo "tests=pass"
          echo "publish=ok"
          echo "url=${{ steps.deploy.outputs.deployment-url }}"
          echo "::endgroup::"

  # JOB: Verify WASM integrity and API health after deployment (push only)
  health_check:
    needs: test_and_build_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Health Check
    steps:
      - name: Verify deployment health
        run: |
          set -e
          echo "::group::Health"

          check_wasm() {
            BOOT=$(curl -f -s --max-time 10 --retry 3 --retry-delay 5 \
              "https://redmuffin.net/_framework/blazor.boot.json")

            LINKER=$(echo "$BOOT" | jq -r '.linkerEnabled // "false"')
            echo "wasm_linker=$LINKER"
            if [ "$LINKER" != "true" ]; then
              echo "FAIL: wasm_linker=$LINKER expected=true"
              return 1
            fi

            ASSEMBLIES=$(echo "$BOOT" | jq '[.resources.fingerprinting | keys[] | select(endswith(".wasm"))] | length')
            echo "wasm_assemblies=$ASSEMBLIES"
            if [ "$ASSEMBLIES" -gt 60 ]; then
              echo "FAIL: wasm_assemblies=$ASSEMBLIES max=60"
              return 1
            fi
          }

          check_api() {
            RESPONSE=$(curl -f -s --max-time 10 --retry 3 --retry-delay 5 \
              "https://redmuffin.net/api/HelloWorld")
            if echo "$RESPONSE" | grep -q "Welcome to Azure Functions!"; then
              echo "api=healthy"
            else
              echo "FAIL: api response_unexpected"
              return 1
            fi
          }

          check_wasm &
          W_PID=$!
          check_api &
          A_PID=$!

          wait $W_PID || { echo "FAIL: wasm_check exit_code=$?"; kill $A_PID 2>/dev/null; exit 1; }
          wait $A_PID || { echo "FAIL: api_check exit_code=$?"; exit 1; }
          echo "result=pass"
          echo "::endgroup::"

  # JOB: Handle documentation-only changes (skipped deployment)
  docs_only_changed_job:
    needs: check_changes
    if: |
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')) &&
      needs.check_changes.outputs.should_skip == 'true'
    runs-on: ubuntu-latest
    name: Documentation Only Changed
    steps:
      - name: Skip Deployment
        run: |
          echo "result=skip reason=pipeline-neutral"

  # JOB: Handle pull request closures
  close_pull_request_job:
    permissions:
      contents: none
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }}
          action: "close"
