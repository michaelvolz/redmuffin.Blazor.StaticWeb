# This workflow will build and push a web application to an Azure Static Web App when you change your code.
#
# This workflow assumes you have already created the target Azure Static Web App.
# For instructions see https://docs.microsoft.com/azure/static-web-apps/get-started-portal?tabs=vanilla-javascript
#
# To configure this workflow:
#
# 1. Set up a secret in your repository named AZURE_STATIC_WEB_APPS_API_TOKEN with the value of your Static Web Apps deployment token.
#    For instructions on obtaining the deployment token see: https://docs.microsoft.com/azure/static-web-apps/deployment-token-management
#
# 3. Change the values for the APP_LOCATION, API_LOCATION and APP_ARTIFACT_LOCATION, AZURE_STATIC_WEB_APPS_API_TOKEN environment variables (below).
#    For instructions on setting up the appropriate configuration values go to https://docs.microsoft.com/azure/static-web-apps/front-end-frameworks
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ "master" ]

# Environment variables available to all jobs and steps in this workflow
env:
  APP_LOCATION: "src/redmuffin.Blazor.StaticWeb" # location of your client code
  API_LOCATION: "src/redmuffin.Blazor.StaticWeb.Api" # location of your api source code - optional
  APP_ARTIFACT_LOCATION: "wwwroot" # location of client code build output
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }} # secret containing deployment token for your static web app

permissions:
  contents: read

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to properly check changes
      - name: Check if only documentation files changed
        id: check
        run: |
          # Define files to skip deployment for (documentation and non-deployed files)
          # Add new files to this list as needed (one per line)
          DOC_FILES=(
            # Documentation files
            "README.md"
            "CHANGELOG.md"
            "docs/*.md"
            "tasks/*.md"
            ".github/copilot-instructions.md"
            ".github/instructions/*.md"
            ".github/prompts/*.md"
            ".github/chatmodes/*.md"
            # Test projects (source files are committed but don't affect deployment)
            "tests/**/*"
            # Build and development tools (committed but not deployed)
            "scripts/**/*"
            ".editorconfig"
            ".mcp.json"
            ".coverletrc"
            # Add more non-deployed files here as needed
          )

          # Build regex pattern from file list
          PATTERN=""
          for file in "${DOC_FILES[@]}"; do
            if [[ -n "$PATTERN" ]]; then
              PATTERN="$PATTERN|"
            fi
            # Escape dots in filenames for regex
            ESCAPED_FILE=$(echo "$file" | sed 's/\./\\./g')
            PATTERN="${PATTERN}${ESCAPED_FILE}"
          done

          echo "Using file pattern: $PATTERN"

          # For PRs, compare with the base branch
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Checking PR changes..."
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          # For pushes, compare with previous commit
          else
            echo "Checking push changes..."
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          # If empty diff (first commit or error), don't skip
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "Empty diff detected - not skipping deploy"
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Count all changed files
          TOTAL_CHANGED=$(echo "$CHANGED_FILES" | wc -l)

          # Count how many of our docs files changed
          DOC_FILES_CHANGED=$(echo "$CHANGED_FILES" | grep -E "$PATTERN" | wc -l)

          echo "Total files changed: $TOTAL_CHANGED"
          echo "Doc files changed: $DOC_FILES_CHANGED"

          # If only doc files changed and they exist in the changed files list, skip deployment
          if [[ $DOC_FILES_CHANGED -gt 0 && $DOC_FILES_CHANGED -eq $TOTAL_CHANGED ]]; then
            echo "Only documentation and non-deployed files changed, skipping deployment"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "Code files changed, proceeding with deployment"
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  # JOB: Dependency vulnerability scanning
  dependency_scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  test_and_build_job:
    needs: check_changes
    if: |
      needs.check_changes.outputs.should_skip != 'true' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test, Build and Deploy
    env:
      # Environment variables for Azure Functions testing
      Values__RainDropClientId: ${{ secrets.RAINDROP_CLIENT_ID }}
      Values__RainDropClientSecret: ${{ secrets.RAINDROP_CLIENT_SECRET }}
      Values__RainDropTestToken: ${{ secrets.RAINDROP_TEST_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for faster checkout
          show-progress: false  # Reduce log noise

      # OPTIMIZATION: Single .NET setup for both testing and building
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # OPTIMIZATION: Cache .NET packages for faster builds
      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
            ~/.dotnet/tools
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # OPTIMIZATION: Single dependency restoration
      - name: Restore dependencies
        run: dotnet restore

      # TESTING PHASE: Run tests first to fail fast
      - name: Create test configuration
        run: |
          mkdir -p src/redmuffin.Blazor.StaticWeb.Api
          cat > src/redmuffin.Blazor.StaticWeb.Api/local.settings.json << 'EOF'
          {
            "IsEncrypted": false,
            "Values": {
              "AzureWebJobsStorage": "UseDevelopmentStorage=true",
              "FUNCTIONS_WORKER_RUNTIME": "dotnet-isolated",
              "RainDropClientId": "${{ secrets.RAINDROP_CLIENT_ID }}",
              "RainDropClientSecret": "${{ secrets.RAINDROP_CLIENT_SECRET }}",
              "RainDropTestToken": "${{ secrets.RAINDROP_TEST_TOKEN }}"
            }
          }
          EOF

      # TESTING PHASE: Fast fail if tests don't pass
      - name: Run tests
        run: |
          echo "🧪 Running TUnit Tests..."
          dotnet test --no-restore --verbosity normal
          if [ $? -ne 0 ]; then
            echo "❌ Tests failed! Stopping deployment."
            exit 1
          fi
          echo "✅ All tests passed! Proceeding with build and deployment."

      # BUILD PHASE: Build applications for deployment
      - name: Build Blazor WebAssembly Application
        run: |
          echo "🏗️ Building Blazor WebAssembly Application..."
          dotnet publish ${{ env.APP_LOCATION }} \
            -c Release \
            -o ${{ env.APP_LOCATION }}/bin/Release/publish \
            --no-restore \
            --verbosity normal \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:InvariantGlobalization=true

      - name: Build Azure Functions API
        run: |
          echo "⚡ Building Azure Functions API..."
          dotnet publish ${{ env.API_LOCATION }} \
            -c Release \
            -o ${{ env.API_LOCATION }}/bin/Release/publish \
            --no-restore \
            --verbosity normal

      - name: Verify Build Output Structure
        run: |
          echo "🔍 Verifying Build Output Structure..."
          echo "Blazor app output:"
          ls -la ${{ env.APP_LOCATION }}/bin/Release/publish/
          echo ""
          echo "Looking for wwwroot in Blazor output:"
          find ${{ env.APP_LOCATION }}/bin/Release/publish/ -name "wwwroot" -type d || echo "No wwwroot directory found"
          echo ""
          echo "API output:"
          ls -la ${{ env.API_LOCATION }}/bin/Release/publish/

      # DEPLOYMENT PHASE: Upload and deploy to Azure Static Web Apps
      - name: Setup Node.js for Azure Static Web Apps CLI
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Remove cache config since there's no package.json in this project

      # OPTIMIZATION: Cache npm global packages for SWA CLI
      - name: Cache npm global packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules
          key: ${{ runner.os }}-npm-global-swa-cli-${{ hashFiles('.github/workflows/azure-static-web-apps-*.yml') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-swa-cli-
            ${{ runner.os }}-npm-global-

      # OPTIMIZATION: Install Azure SWA CLI with improved error handling and caching
      - name: Install Azure Static Web Apps CLI
        run: |
          # 🚀 OPTIMIZED NPM INSTALLATION
          # Use npx for better caching and to avoid global installation pollution

          echo "📦 Installing Azure Static Web Apps CLI..."
          echo "ℹ️  Note: Any deprecation warnings are harmless and can be ignored"
          echo ""

          # Check if SWA CLI is available in cache
          if command -v swa >/dev/null 2>&1; then
            echo "✅ SWA CLI found in cache"
            echo "Version: $(swa --version)"
          else
            # Install globally with suppressed warnings for cleaner output
            echo "Installing SWA CLI globally..."
            npm install -g @azure/static-web-apps-cli --silent 2>/dev/null || \
            npm install -g @azure/static-web-apps-cli

            echo ""
            echo "✅ Azure Static Web Apps CLI installed successfully"
            echo "Version: $(swa --version)"
          fi

      # Upload build artifacts for traceability and debugging
      - name: Upload Blazor build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blazor-build-${{ github.sha }}
          path: ${{ env.APP_LOCATION }}/bin/Release/publish/wwwroot
          retention-days: 30

      - name: Upload API build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build-${{ github.sha }}
          path: ${{ env.API_LOCATION }}/bin/Release/publish
          retention-days: 30

      - name: Deploy to Azure Static Web Apps
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }}
        run: |
          set -e  # Exit on any error

          echo "📦 Deploying to Azure Static Web Apps..."
          echo "Using app location: ${{ env.APP_LOCATION }}/bin/Release/publish"
          echo "Using API location: ${{ env.API_LOCATION }}/bin/Release/publish"

          # FIXED: Use explicit parameters to override swa-cli.config.json
          # The explicit --app-location, --api-location, and --output-location parameters
          # should take precedence over the config file settings
          swa deploy \
            --app-location ${{ env.APP_LOCATION }}/bin/Release/publish \
            --api-location ${{ env.API_LOCATION }}/bin/Release/publish \
            --output-location wwwroot \
            --deployment-token $AZURE_STATIC_WEB_APPS_API_TOKEN \
            --env production \
            --no-use-keychain \
            --verbose

          echo ""
          echo "✅ Pipeline completed successfully!"
          echo "🧪 Tests passed, build succeeded, deployment completed"
          echo "🌐 Your Blazor WebAssembly app is now live on Azure Static Web Apps"

          echo ""
          echo "🔍 Verifying deployment health..."
          # Wait for deployment to propagate
          sleep 30

          # Basic health check (adjust URL to your actual domain)
          echo "Performing basic connectivity test..."
          if curl -f -s --max-time 30 --retry 3 --retry-delay 10 \
             "https://lively-cliff-0945be603.azurestaticapps.net" > /dev/null; then
            echo "✅ Deployment health check passed - site is accessible"
          else
            echo "⚠️ Deployment health check failed - site may not be fully ready yet"
            echo "This is not necessarily an error - DNS propagation may take time"
          fi

  # JOB: Handle documentation-only changes (skipped deployment)
  docs_only_changed_job:
    needs: check_changes
    if: |
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')) &&
      needs.check_changes.outputs.should_skip == 'true'
    runs-on: ubuntu-latest
    name: Documentation Only Changed
    steps:
      - name: Skip Deployment
        run: |
          echo "📝 Only documentation and non-deployed files changed."
          echo "⏭️ Skipping deployment process as no code changes were detected."
          echo ""
          echo "💡 WHAT THIS MEANS FOR YOU:"
          echo "   • Tests and builds are skipped to save time and resources"
          echo "   • Documentation changes don't require application redeployment"
          echo "   • Your live application remains unchanged and operational"
          echo "   • GitHub Pages documentation will still be updated automatically"

  # JOB: Handle pull request closures
  close_pull_request_job:
    permissions:
      contents: none
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }}
          action: "close"