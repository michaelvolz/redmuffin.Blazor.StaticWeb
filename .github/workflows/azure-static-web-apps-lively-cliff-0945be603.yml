# This workflow will build and push a web application to an Azure Static Web App when you change your code.
#
# This workflow assumes you have already created the target Azure Static Web App.
# For instructions see https://docs.microsoft.com/azure/static-web-apps/get-started-portal?tabs=vanilla-javascript
#
# To configure this workflow:
#
# 1. Set up a secret in your repository named AZURE_STATIC_WEB_APPS_API_TOKEN with the value of your Static Web Apps deployment token.
#    For instructions on obtaining the deployment token see: https://docs.microsoft.com/azure/static-web-apps/deployment-token-management
#
# 3. Change the values for the SRC_APP_LOCATION, SRC_API_LOCATION and APP_ARTIFACT_LOCATION, AZURE_STATIC_WEB_APPS_API_TOKEN environment variables (below).
#    For instructions on setting up the appropriate configuration values go to https://docs.microsoft.com/azure/static-web-apps/front-end-frameworks
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: ["master"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["master"]

# Environment variables available to all jobs and steps in this workflow
env:
  # Source code locations for building (renamed to avoid conflict with Azure Action)
  # The Azure Static Web Apps Action reads APP_LOCATION env var and overrides the app_location input
  SRC_APP_LOCATION: "src/redmuffin.Blazor.StaticWeb" # location of your client code
  SRC_API_LOCATION: "src/redmuffin.Blazor.StaticWeb.Api" # location of your api source code - optional
  APP_ARTIFACT_LOCATION: "wwwroot" # location of client code build output
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }} # secret containing deployment token for your static web app

permissions:
  contents: read

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_output.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for reliable change detection
          show-progress: false # Reduce log noise

      - name: Check if only documentation files changed
        id: check
        uses: tj-actions/changed-files@v47.0.5
        with:
          files: |
            README.md
            AGENTS.md
            CHANGELOG.md
            docs/**/*.md
            tasks/**/*.md
            spec/**/*
            .github/guides/**/*.md
            .github/prompts/**/*.md
            .github/chatmodes/**/*.md
            .opencode/**/*
            tests/**/*
            scripts/**/*
            .editorconfig
            .mcp.json
            .coverletrc
            .vscode/**/*
            *.code-workspace
            *.sln.DotSettings
            .config/**/*
            .filenesting.json
            .trae/**/*
            swa-cli.config.json
            Start.ps1
            test.ps1
            config/**/*
            .changelog-state
            src/**/Properties/launchSettings.json
            src/**/appsettings.Development.json
            src/**/*.local.settings.json*
            .gitattributes
            .gitignore

      - name: Set skip output
        id: skip_output
        run: |
          # Use the changed-files action's built-in logic instead of complex shell script
          if [[ "${{ steps.check.outputs.only_changed }}" == "true" ]]; then
            echo "Only documentation and non-deployed files changed, skipping deployment"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "Code files changed, proceeding with deployment"
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  test_and_build_job:
    needs: check_changes
    if: |
      needs.check_changes.outputs.should_skip != 'true' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test, Build and Deploy
    env:
      # Environment variables for Azure Functions testing
      # These are automatically picked up by:
      # - TestBase class via AddEnvironmentVariables() for tests
      # - Settings class via Environment.GetEnvironmentVariable() for Azure Functions
      # No local.settings.json file needed in CI/CD - optimized for faster execution
      Values__RainDropClientId: ${{ secrets.RAINDROP_CLIENT_ID }}
      Values__RainDropClientSecret: ${{ secrets.RAINDROP_CLIENT_SECRET }}
      Values__RainDropTestToken: ${{ secrets.RAINDROP_TEST_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1 # Shallow clone for faster checkout
          show-progress: false # Reduce log noise

      # OPTIMIZATION: Single .NET setup with WASM workload for Blazor builds
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
          workloads: wasm-tools

      # OPTIMIZATION: Cache NuGet packages for faster subsequent builds
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # OPTIMIZATION: Single dependency restoration
      - name: Restore dependencies
        run: dotnet restore

      # TESTING PHASE: Fast fail if tests don't pass with parallel execution
      # Note: Tests automatically use environment variables set in the job environment
      # No local.settings.json file needed as TestBase class uses AddEnvironmentVariables()
      - name: Run tests
        run: |
          echo "🧪 Running TUnit Tests..."
          echo "ℹ️  Tests will automatically use environment variables in CI/CD environment"
          echo "ℹ️  TUnit runs tests in parallel by default - no additional configuration needed"
          dotnet test --no-restore --verbosity quiet --logger trx --results-directory TestResults /p:CollectCoverage=false
          if [ $? -ne 0 ]; then
            echo "❌ Tests failed! Stopping deployment."
            exit 1
          fi
          echo "✅ All tests passed! Proceeding with build and deployment."

      # BUILD AND DEPLOY PHASE: Only runs if tests pass
      # Note: Using Azure/static-web-apps-deploy action instead of SWA CLI
      # This allows skip_app_build: true to preserve pre-compressed Brotli files

      - name: Build Blazor WebAssembly Application
        run: |
          echo "🏗️ Building Blazor WebAssembly Application..."
          # Build with optimizations for production deployment
          dotnet publish ${{ env.SRC_APP_LOCATION }} \
            -c Release \
            -o ${{ env.SRC_APP_LOCATION }}/bin/Release/publish \
            --no-restore \
            --no-dependencies \
            --verbosity quiet \
            --nologo

      - name: Build Azure Functions API
        run: |
          echo "⚡ Building Azure Functions API..."
          dotnet publish ${{ env.SRC_API_LOCATION }} \
            -c Release \
            -o ${{ env.SRC_API_LOCATION }}/bin/Release/publish \
            --no-restore \
            --no-dependencies \
            --verbosity quiet \
            --nologo

      - name: Verify Brotli compression files exist
        run: |
          echo "🔍 Verifying Brotli compressed files..."
          PUBLISH_WWWROOT="${{ env.SRC_APP_LOCATION }}/bin/Release/publish/wwwroot"
          if find "$PUBLISH_WWWROOT" -name "*.br" | grep -q .; then
            echo "✅ Brotli files found"
            echo "Sample Brotli files:"
            find "$PUBLISH_WWWROOT" -name "*.br" | head -10
            echo ""
            echo "File count:"
            echo "  .br files: $(find $PUBLISH_WWWROOT -name "*.br" | wc -l)"
            echo "  .gz files: $(find $PUBLISH_WWWROOT -name "*.gz" | wc -l)"
          else
            echo "❌ No Brotli files found - build may not have compression enabled"
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/redmuffin.Blazor.StaticWeb/bin/Release/publish/wwwroot"
          api_location: "src/redmuffin.Blazor.StaticWeb.Api/bin/Release/publish"
          output_location: "" # Empty because app is pre-built
          skip_app_build: true # Critical: prevents Oryx rebuild and preserves Brotli files

      - name: Deployment Summary
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "🧪 Tests passed, build succeeded, deployment completed"
          echo "🌐 Your Blazor WebAssembly app is now live on Azure Static Web Apps"
          echo "📦 Brotli compression preserved - smaller file sizes for faster loading"

      # Health check after deployment
      - name: Verify deployment health
        run: |
          echo "🔍 Verifying deployment health..."
          sleep 5  # Minimum required wait time

          echo "Performing basic connectivity test..."
          if curl -f -s --max-time 5 --retry 1 --retry-delay 2 \
             "https://redmuffin.net" > /dev/null; then
            echo "✅ Deployment health check passed - site is accessible"
          else
            echo "⚠️ Site may not be fully ready yet - this is normal for new deployments"
            echo "ℹ️  You can manually verify at: https://redmuffin.net"
          fi

          echo ""
          echo "🔍 Verifying Brotli compression..."
          # Check if the server is serving Brotli compressed files
          CONTENT_ENCODING=$(curl -s -I -H "Accept-Encoding: br" \
            "https://redmuffin.net/_framework/dotnet.wasm" 2>/dev/null | \
            grep -i "content-encoding:" | awk '{print $2}' | tr -d '\r')

          if [ "$CONTENT_ENCODING" = "br" ]; then
            echo "✅ Brotli compression verified - files are being served with content-encoding: br"
          else
            echo "⚠️ Brotli encoding not detected (content-encoding: $CONTENT_ENCODING)"
            echo "ℹ️  This may be normal immediately after deployment - compression may take a moment to activate"
          fi

  # JOB: Handle documentation-only changes (skipped deployment)
  docs_only_changed_job:
    needs: check_changes
    if: |
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')) &&
      needs.check_changes.outputs.should_skip == 'true'
    runs-on: ubuntu-latest
    name: Documentation Only Changed
    steps:
      - name: Skip Deployment
        run: |
          echo "📝 Only documentation and non-deployed files changed."
          echo "⏭️ Skipping deployment process as no code changes were detected."
          echo ""
          echo "💡 WHAT THIS MEANS FOR YOU:"
          echo "   • Tests and builds are skipped to save time and resources"
          echo "   • Documentation changes don't require application redeployment"
          echo "   • Your live application remains unchanged and operational"
          echo "   • GitHub Pages documentation will still be updated automatically"

  # JOB: Handle pull request closures
  close_pull_request_job:
    permissions:
      contents: none
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_CLIFF_0945BE603 }}
          action: "close"
