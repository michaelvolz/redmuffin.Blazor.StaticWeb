<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#1b6ec2"/>
    <meta name="description" content="redmuffin — personal website and digital garden"/>
    <title>redmuffin</title>
    <base href="/"/>
    <link href="favicon.png" rel="icon" type="image/png" sizes="any"/>
    <link href="icon-192.png" rel="apple-touch-icon" sizes="192x192"/>
    <script type="importmap"></script>
    <!-- Critical-path loading indicator CSS — identical rules in app.min.css -->
    <style>
        .loading-progress{display:block;height:8rem;margin:20vh auto 1rem auto;position:relative;width:8rem}
        .loading-progress circle{fill:none;stroke:#e0e0e0;stroke-width:0.6rem;transform:rotate(-90deg);transform-origin:50% 50%}
        .loading-progress circle:last-child{stroke:#1b6ec2;stroke-dasharray:calc(3.141 * var(--blazor-load-percentage, 0%) * 0.8), 500%}
        .loading-progress-text{font-family:Arial,Helvetica,sans-serif;font-weight:bold;inset:calc(20vh + 3.25rem) 0 auto 0.2rem;position:absolute;text-align:center}
        .loading-progress-text:after{content:var(--blazor-load-percentage-text, "Loading")}
    </style>
    <!-- Preload critical CSS file for faster rendering -->
    <link rel="preload" href="css/app.min.css" as="style">
    <link href="css/app.min.css" rel="stylesheet"/>

    <link rel="preload" href="css/fontawesome/all.min.css" as="style">
    <link rel="stylesheet" href="css/fontawesome/all.min.css"/>
    <!-- Preload Blazor WebAssembly runtime for faster startup -->
    <link rel="preload" href="_framework/blazor.webassembly#[.{fingerprint}].js" as="script" crossorigin="anonymous">
    <link href="css/media-query-debugger.min.css" rel="stylesheet"/>
    <script>
        setTimeout(() => {
            var element = document.getElementById("result");
            if (element) element.style.display = "block";
        }, 1000);
    </script>
</head>

<body>
<div id="app">
    <div id="result" style="display: none;">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%"/>
            <circle r="40%" cx="50%" cy="50%"/>
        </svg>
        <div class="loading-progress-text"></div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <button class="dismiss" aria-label="Dismiss error">✕</button>
</div>
<script src="js/page-load-timing.min#[.{fingerprint}].js" defer></script>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js" crossorigin="anonymous"></script>
</body>

</html>
