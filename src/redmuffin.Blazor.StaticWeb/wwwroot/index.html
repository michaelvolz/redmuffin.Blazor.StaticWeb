<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="redmuffin — personal website and digital garden"/>
    <title>redmuffin</title>
    <base href="/"/>
    <link href="favicon.png" rel="icon" type="image/png"/>
    <!-- Preload critical CSS file for faster rendering -->
    <link rel="preload" href="css/app.min.css" as="style">
    <link href="css/app.min.css" rel="stylesheet"/>

    <link rel="stylesheet" href="css/fontawesome/all.min.css"/>
    <!-- Preload Blazor WebAssembly runtime for faster startup -->
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" crossorigin="anonymous">
    <!-- Add the media query debugger CSS below the main stylesheets -->
    <link href="css/media-query-debugger.min.css" rel="stylesheet"/>
    <script>
        setTimeout(() => {
            var element = document.getElementById("result");
            if (element) element.style = "block";
        }, 1000);
    </script>
</head>

<body>
<div id="app">
    <div id="result" style="display: none;">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%"/>
            <circle r="40%" cx="50%" cy="50%"/>
        </svg>
        <div class="loading-progress-text"></div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
</div>
<script src="js/page-load-timing.min.js" defer></script>
<script src="_framework/blazor.webassembly.js" crossorigin="anonymous"></script>
</body>

</html>
