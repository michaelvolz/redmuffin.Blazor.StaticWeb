<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#1b6ec2"/>
    <meta name="description" content="redmuffin — personal website and digital garden"/>
    <title>redmuffin</title>
    <base href="/"/>
    <link href="favicon.png" rel="icon" type="image/png" sizes="any"/>
    <link href="icon-192.png" rel="apple-touch-icon" sizes="192x192"/>
    <script type="importmap"></script>
    <!-- Critical-path loading indicator CSS — identical rules in app.min.css -->
    <style>
        .loading-progress{display:block;height:8rem;margin:20vh auto 1rem auto;position:relative;width:8rem}
        .loading-progress circle{fill:none;stroke:#e0e0e0;stroke-width:0.6rem;transform:rotate(-90deg);transform-origin:50% 50%}
        .loading-progress circle:last-child{stroke:#1b6ec2;stroke-dasharray:calc(3.141 * var(--blazor-load-percentage, 0%) * 0.8), 500%}
        .loading-progress-text{font-family:Arial,Helvetica,sans-serif;font-weight:bold;inset:calc(20vh + 3.25rem) 0 auto 0.2rem;position:absolute;text-align:center}
        .loading-progress-text:after{content:var(--blazor-load-percentage-text, "Loading")}
    </style>
    <!-- Preload critical CSS file for faster rendering -->
    <link rel="preload" href="css/app.min.css" as="style">
    <link href="css/app.min.css" rel="stylesheet"/>

    <link rel="preload" href="css/fontawesome/all.min.css" as="style">
    <link rel="stylesheet" href="css/fontawesome/all.min.css"/>
    <!-- Preload Blazor WebAssembly runtime for faster startup -->
    <link rel="preload" href="_framework/blazor.webassembly#[.{fingerprint}].js" as="script" crossorigin="anonymous">
    <link href="css/media-query-debugger.min.css" rel="stylesheet"/>
    <script>
        setTimeout(() => {
            var element = document.getElementById("result");
            if (element) element.style.display = "block";
        }, 1000);
    </script>
</head>

<body>
<div id="app">
    <div id="result" style="display: none;">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%"/>
            <circle r="40%" cx="50%" cy="50%"/>
        </svg>
        <div class="loading-progress-text"></div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <button class="dismiss" aria-label="Dismiss error">✕</button>
</div>
<pre id="wasm-diag" style="font:11px/1.4 monospace;color:#000;background:#fff;margin:0 auto;max-width:360px;padding:8px;white-space:pre-wrap;word-break:break-all">Starting...</pre>
<script>
(function(){var d=document.getElementById("wasm-diag"),l=function(m){d.textContent+=(d.textContent?"\n":"")+m};
l(navigator.userAgent);
l("WASM: simd="+WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,12,1,0,10,12,1,10,0,65,0,253,15,253,18,0,11]))+" eh="+WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,4,1,96,0,0,2,13,1,2,106,115,3,101,120,99,0,0,3,2,1,0,10,9,1,7,0,2,64,6,64,0,0,11,11]));
try{var s=document.querySelector("script[src*='blazor.webassembly']");if(s){s.addEventListener("load",function(){l("blazor.js: loaded")});s.addEventListener("error",function(e){l("blazor.js: FAILED")})}}catch(e){l("blazor.js: not found")}
window.addEventListener("error",function(e){l("ERR: "+(e.message||e.filename))});
window.addEventListener("unhandledrejection",function(e){l("PROMISE: "+e.reason)});
try{var n=0,o=typeof Blazor!=="undefined"?Blazor:null;if(o&&o.start){var orig=o.start;o.start=function(){n++;l("blazor.start: called");return orig.apply(o,arguments).then(function(){d.style.display="none"}).catch(function(e){l("FAIL: "+e)})}}setTimeout(function(){if(!n)l("blazor.start: NOT called ("+(o?"Blazor exists":"no Blazor")+")")},8000)}catch(e){l("hook err: "+e)}
})();
</script>
<script src="js/page-load-timing.min#[.{fingerprint}].js" defer></script>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js" crossorigin="anonymous"></script>
</body>

</html>
