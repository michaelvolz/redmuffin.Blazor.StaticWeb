version: "3.8"

# Security Note:
# Secrets should NEVER be in .env files or docker-compose files.
# Use VS Code DevContainer Secrets (defined in devcontainer.json) instead.
# Environment variables below are for non-sensitive configuration only.

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: redmuffin-devcontainer
    security_opt:
      - seccomp=unconfined
    privileged: true
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # Secrets are injected by VS Code DevContainer from OS credential manager
      # Do NOT add secrets here - they are defined in devcontainer.json secrets block
    volumes:
      - ..:/workspaces/redmuffin.Blazor.StaticWeb:cached
      - devcontainer-cache:/root/.cache
      - devcontainer-npm:/root/.npm
      - devcontainer-nuget:/root/.nuget
    command: sleep infinity
    ports:
      - "4280:4280"
      - "5233:5233"
      - "7071:7071"

volumes:
  devcontainer-cache:
  devcontainer-npm:
  devcontainer-nuget:
