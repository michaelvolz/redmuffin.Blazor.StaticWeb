component-map:
  redmuffin.Blazor.StaticWeb: Frontend
  redmuffin.Blazor.StaticWeb.Common: Shared
  redmuffin.Blazor.StaticWeb.Api: Backend
  Components: Frontend
  AzureHealthCheck.Contracts: Shared
  AzureHealthCheck: Frontend
  ApiHealth.Page: Frontend
  ApiHealth.Tests: Frontend
  AzureHealthCheck.Tests: Frontend
  Articles: Frontend
  Articles.Tests: Frontend
  Videos: Frontend
  Videos.Tests: Frontend
  Raindrop.Contracts: Shared
  Raindrop: Frontend
  Raindrop.Tests: Frontend
  SwaLauncher: Frontend

allowed-dependencies:
